name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'my-app/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./my-app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/my-k8s-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/my-k8s-app:latest

      - name: Update deployment manifest image
        run: |
          sed -i "s|image:.*|image: ghcr.io/${{ github.repository_owner }}/my-k8s-app:${{ github.sha }}|g" my-app/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add my-app/deployment.yaml
          git commit -m "Auto-update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push