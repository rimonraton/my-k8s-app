apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-real-app
  labels:
    app: my-real-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: my-real-app
  template:
    metadata:
      labels:
        app: my-real-app
    spec:
      containers:
      - name: web
        image: nginx:alpine
        command: ["/bin/sh", "-c"]
        args:
          - echo "<h1 style='color:red;text-align:center;margin-top:20%;'>🚀 Hello Raton! Continuous Delivery with K8s & ArgoCD is LIVE! (v3.0)</h1>" > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-real-app-svc
spec:
  type: NodePort
  selector:
    app: my-real-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
