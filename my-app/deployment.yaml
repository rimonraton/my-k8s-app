apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-real-app
  labels:
    app: my-real-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-real-app
  template:
    metadata:
      labels:
        app: my-real-app
    spec:
      containers:
      - name: web
        image: ghcr.io/rimonraton/my-k8s-app:20da299b56ae688e2d172f3e67ac921ebc563c09
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: my-real-app-svc
spec:
  type: NodePort
  selector:
    app: my-real-app
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080