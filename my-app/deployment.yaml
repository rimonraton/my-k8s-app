apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-real-app
  labels:
    app: my-real-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-real-app
  template:
    metadata:
      labels:
        app: my-real-app
    spec:
      containers:
      - name: web
        image: nginx:alpine  # টেস্টের জন্য লাইটওয়েট ইমেজ, পরবর্তীতে আপনার ডকার ইমেজ নাম বসাতে পারেন
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-real-app-svc
spec:
  type: NodePort
  selector:
    app: my-real-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080