apiVersion: v1
kind: Namespace
metadata:
  name: spinnaker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: spinnaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2023-09-07T02-12-04Z
        args:
        - server
        - /data
        env:
        - name: MINIO_ROOT_USER
          value: spinnakeradmin
        - name: MINIO_ROOT_PASSWORD
          value: spinnakerpassword
        ports:
        - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: spinnaker
spec:
  selector:
    app: minio
  ports:
  - port: 9000
    targetPort: 9000